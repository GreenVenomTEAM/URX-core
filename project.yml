name: URXCore
options:
  bundleIdPrefix: com.greenvn
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "URX Core"
    INFOPLIST_KEY_UIRequiresFullScreen: YES
targets:
  URXCore:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.greenvn.urxcore
