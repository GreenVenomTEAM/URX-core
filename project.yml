name: URXCore
options:
  bundleIdPrefix: com.greenvn
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "URX Core"
    INFOPLIST_KEY_UIRequiresFullScreen: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIFileSharingEnabled: YES
    INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
packages:
  OpenSSL-Package:
    url: https://github.com/krzyzanowskim/OpenSSL-Package.git
    from: 3.6.5000
targets:
  URXCore:
    type: application
    dependencies:
      - package: OpenSSL-Package
        product: OpenSSL
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.greenvn.urxcore
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SWIFT_OBJC_BRIDGING_HEADER: Sources/URXBridging.h
        OTHER_LDFLAGS: "$(inherited) -lz"
