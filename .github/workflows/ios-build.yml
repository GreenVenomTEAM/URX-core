name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare Sileo storyboard before project generation
        run: python3 Scripts/patch-sileo-storyboard.py

      - name: Generate project
        run: xcodegen generate

      - name: Resolve packages and patch Alderis for iOS 18 SDK
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project URXCore.xcodeproj \
            -scheme URXCore \
            -derivedDataPath "$RUNNER_TEMP/URXCore-DerivedData"
          python3 Scripts/patch-alderis-ios18.py \
            "$RUNNER_TEMP/URXCore-DerivedData/SourcePackages/checkouts/Alderis/Alderis/ColorPickerInnerViewController.swift"
          python3 Scripts/patch-sileo-dpkgversion.py \
            "Vendor/Sileo/Sileo/Backend/C Contrib/dpkgversion.h"
          python3 Scripts/patch-sileo-dpkgversion-c.py \
            "Vendor/Sileo/Sileo/Backend/C Contrib/dpkgversion.c"
          python3 Scripts/patch-sileo-zkswizzle-arc.py \
            "Vendor/Sileo/Sileo/UI/WhiteBlur/ZKSwizzle.m"
          python3 Scripts/patch-sileo-portable-xz.py

      - name: Build for iOS Simulator
        run: |
          RESULT="$RUNNER_TEMP/URXCore-Simulator.xcresult"
          if xcodebuild \
            -project URXCore.xcodeproj \
            -scheme URXCore \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/URXCore-DerivedData" \
            -resultBundlePath "$RESULT" \
            CODE_SIGNING_ALLOWED=NO \
            build; then
            :
          else
            xcrun xcresulttool get object --legacy --format json --path "$RESULT" > "$RUNNER_TEMP/URXCore-Simulator-result.json"
            python3 - "$RUNNER_TEMP/URXCore-Simulator-result.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          def walk(value, path=""):
              if isinstance(value, dict):
                  for key, child in value.items():
                      next_path = f"{path}.{key}"
                      if key in {"message", "issueDescription", "title", "failureMessage"} and isinstance(child, dict):
                          rendered = child.get("_value")
                          if rendered:
                              print(f"{next_path}: {rendered}")
                      walk(child, next_path)
              elif isinstance(value, list):
                  for child in value:
                      walk(child, path)
          walk(data)
          PY
            exit 1
          fi

      - name: Build for physical iOS devices
        run: |
          xcodebuild \
            -project URXCore.xcodeproj \
            -scheme URXCore \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/URXCore-DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Ensure Files app sharing keys are present
        run: |
          APP_PATH="$RUNNER_TEMP/URXCore-DerivedData/Build/Products/Release-iphoneos/URXCore.app"
          /usr/libexec/PlistBuddy -c "Set :UIFileSharingEnabled true" "$APP_PATH/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :LSSupportsOpeningDocumentsInPlace true" "$APP_PATH/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$APP_PATH/Info.plist"

      - name: Verify iPhone and iPad device family in app bundle
        run: |
          APP_PATH="$RUNNER_TEMP/URXCore-DerivedData/Build/Products/Release-iphoneos/URXCore.app"
          python3 - "$APP_PATH/Info.plist" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], "rb") as f:
              info = plistlib.load(f)
          families = info.get("UIDeviceFamily", [])
          print("UIDeviceFamily:", families)
          print("UIRequiresFullScreen:", info.get("UIRequiresFullScreen"))
          print("UILaunchScreen:", info.get("UILaunchScreen"))
          print("UIFileSharingEnabled:", info.get("UIFileSharingEnabled"))
          print("LSSupportsOpeningDocumentsInPlace:", info.get("LSSupportsOpeningDocumentsInPlace"))
          if info.get("UIFileSharingEnabled") is not True:
              raise SystemExit("ERROR: UIFileSharingEnabled is missing or false.")
          if info.get("LSSupportsOpeningDocumentsInPlace") is not True:
              raise SystemExit("ERROR: LSSupportsOpeningDocumentsInPlace is missing or false.")
          if not any(k in info for k in ("UILaunchScreen", "UILaunchStoryboardName", "UILaunchStoryboards", "UILaunchScreens")):
              raise SystemExit("ERROR: Missing launch screen configuration in Info.plist.")
          if 1 not in families:
              raise SystemExit("ERROR: iPhone is missing from UIDeviceFamily; app would launch in iPad compatibility mode.")
          if 2 not in families:
              raise SystemExit("ERROR: iPad is missing from UIDeviceFamily.")
          PY

      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/URXCore-DerivedData/Build/Products/Release-iphoneos/URXCore.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/URXCore.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/URXCore-unsigned.ipa" Payload
          test -s "$GITHUB_WORKSPACE/URXCore-unsigned.ipa"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: URXCore-unsigned-IPA
          path: URXCore-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
