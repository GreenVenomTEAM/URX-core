name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project URXCore.xcodeproj \
            -scheme URXCore \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build for physical iOS devices
        run: |
          xcodebuild \
            -project URXCore.xcodeproj \
            -scheme URXCore \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/URXCore-DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify iPhone and iPad device family in app bundle
        run: |
          APP_PATH="$RUNNER_TEMP/URXCore-DerivedData/Build/Products/Release-iphoneos/URXCore.app"
          python3 - "$APP_PATH/Info.plist" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], "rb") as f:
              info = plistlib.load(f)
          families = info.get("UIDeviceFamily", [])
          print("UIDeviceFamily:", families)
          print("UIRequiresFullScreen:", info.get("UIRequiresFullScreen"))
          print("UILaunchScreen:", info.get("UILaunchScreen"))
          if not any(k in info for k in ("UILaunchScreen", "UILaunchStoryboardName", "UILaunchStoryboards", "UILaunchScreens")):
              raise SystemExit("ERROR: Missing launch screen configuration in Info.plist.")
          if 1 not in families:
              raise SystemExit("ERROR: iPhone is missing from UIDeviceFamily; app would launch in iPad compatibility mode.")
          if 2 not in families:
              raise SystemExit("ERROR: iPad is missing from UIDeviceFamily.")
          PY

      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/URXCore-DerivedData/Build/Products/Release-iphoneos/URXCore.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/URXCore.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/URXCore-unsigned.ipa" Payload
          test -s "$GITHUB_WORKSPACE/URXCore-unsigned.ipa"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: URXCore-unsigned-IPA
          path: URXCore-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
